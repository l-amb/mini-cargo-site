<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#16263f"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="white">
    <text x="40" y="60" font-size="26" font-weight="bold">🚢 Fleet Management</text>
  </g>
  <!-- ship cards -->
  <g font-family="Arial" fill="white">
    <rect x="40" y="100" width="220" height="120" fill="#1c2f4a" rx="6" stroke="#4a90e2"/>
    <text x="55" y="130" font-size="18">Boat #1 — Sloop</text>
    <rect x="55" y="150" width="190" height="10" fill="#06d6a0" rx="2"/>
    <text x="55" y="200" fill="#9fb3cc">Speed 85% · Cargo 6</text>

    <rect x="290" y="100" width="220" height="120" fill="#1c2f4a" rx="6" stroke="#ffd166"/>
    <text x="305" y="130" font-size="18">Boat #2 — Schooner</text>
    <rect x="305" y="150" width="190" height="10" fill="#ffd166" rx="2"/>
    <text x="305" y="200" fill="#9fb3cc">Speed 60% · Cargo 12</text>

    <rect x="540" y="100" width="220" height="120" fill="#1c2f4a" rx="6" stroke="#ef476f"/>
    <text x="555" y="130" font-size="18">Boat #3 — Freighter</text>
    <rect x="555" y="150" width="160" height="10" fill="#ef476f" rx="2"/>
    <text x="555" y="200" fill="#9fb3cc">Speed 40% · Cargo 30</text>
  </g>
  <!-- leaderboard strip -->
  <rect x="40" y="260" width="720" height="160" fill="#1c2f4a" rx="6" stroke="#5da6ff"/>
  <text x="55" y="295" font-family="Arial" fill="#5da6ff" font-size="18" font-weight="bold">🏆 Fastest Delivery Today</text>
  <g font-family="Arial" font-size="14" fill="#9fb3cc">
    <text x="55" y="325">1. Alex — 0:42</text>
    <text x="55" y="350">2. Maya — 0:48</text>
    <text x="55" y="375">3. Sam — 0:51</text>
  </g>
  <g font-family="Arial" font-size="14" fill="#9fb3cc">
    <text x="400" y="325">4. Robin — 0:55</text>
    <text x="400" y="350">5. Casey — 0:59</text>
    <text x="400" y="375">6. Jamie — 1:02</text>
  </g>
  <text x="400" y="425" font-family="Arial" font-size="14" fill="#9fb3cc" text-anchor="middle">Screenshot 2 · Mini Cargo</text>
</svg>
